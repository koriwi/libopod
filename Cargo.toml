[package]
name = "libopod"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
description = "Safe Rust library for mounted, storage-backed iPods"
keywords = ["ipod", "itunesdb", "music", "sync"]
categories = ["filesystem", "multimedia"]

[features]
default = ["bundled-sqlite"]
bundled-sqlite = ["rusqlite/bundled"]
system-sqlite = []

[dependencies]
flate2 = "1.1.9"
fs2 = "0.4.3"
plist = "1.10.0"
rusqlite = { version = "0.40.2", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.145"
sha1 = "0.11.0"
sha2 = "0.10.9"
thiserror = "2.0.20"

[dev-dependencies]
tempfile = "3.23.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
pedantic = "deny"
